name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines 要求 node >= 20；发布流水线固定 22（release.yml），CI 双版本验证
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version 读取 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 公共 API 面先校验：按需入口 / package exports / 三端组件覆盖 / 文档与样式
      # 全部只读源码与 package.json，不依赖 dist，放在构建前可最快暴露漂移
      - name: Verify public API surface
        run: pnpm verify:api

      # 先构建：react/vue 的 typecheck 与部分测试解析 @centui/core 的
      # dist 类型产物，无 dist 会在 Typecheck 步骤报 TS2307
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r --filter './packages/*' run typecheck

      # L1/L2/L3：core 单测 + vue 组件测试 + v3↔v2 golden 基线对比
      - name: Test
        run: pnpm test

      # 覆盖率硬门禁（per-package）：core 90/85，vue/react 组件层 80/80，
      # wechat 逻辑层 90/80（此前 wechat 缺 test:coverage，门禁形同虚设）。
      # 包间串行执行，避免多个 jsdom 并发导致 golden 初始态时序抖动
      - name: Coverage gate
        run: pnpm coverage

      # L4 e2e：双框架行为契约（截图基线与 OS 字体绑定，仅本地比对）
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E interaction
        run: npx playwright test interaction
