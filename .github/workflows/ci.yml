name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version 读取 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 先构建：react/vue 的 typecheck 与部分测试解析 @centui/core 的
      # dist 类型产物，无 dist 会在 Typecheck 步骤报 TS2307
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r --filter './packages/*' run typecheck

      # L1/L2/L3：core 单测 + vue 组件测试 + v3↔v2 golden 基线对比
      - name: Test
        run: pnpm test

      # 覆盖率硬门禁（per-package）：core 90/85，vue 组件层 80/80
      - name: Coverage gate
        run: pnpm coverage

      # L4 e2e：双框架行为契约（截图基线与 OS 字体绑定，仅本地比对）
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E interaction
        run: npx playwright test interaction
